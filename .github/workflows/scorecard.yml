# .github/workflows/scorecard.yml
#
# Runs OpenSSF Scorecard on every push to main plus a weekly schedule, and
# publishes the results both to GitHub code scanning (so findings show up
# as repo alerts) and to the public Scorecard API (so the README badge
# reflects the current score, not a one-time snapshot).
name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Needed to publish results to the public Scorecard API and to
      # upload SARIF to code scanning.
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@f081e69141f6ea0aa740920b0c7012cd81a4fbe6 # v3.37.3
        with:
          sarif_file: results.sarif
