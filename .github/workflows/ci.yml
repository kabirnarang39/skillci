# .github/workflows/ci.yml
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # go.mod pins go 1.25.3 as the toolchain minimum, so there's no
        # viable second Go version to add here — the matrix dimension that
        # actually catches real drift for this project is OS, not Go
        # version (gitutil already special-cases macOS symlink resolution,
        # and the frontmatter/path lint rules care about path separators).
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25"
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/skillci check examples/example-skill
      - uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2
