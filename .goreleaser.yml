version: 2

project_name: skillci

before:
  hooks:
    - go mod tidy

builds:
  - id: skillci
    main: ./cmd/skillci
    binary: skillci
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: skillci
    ids: [skillci]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

# SBOM per archive (SPDX JSON via syft, goreleaser's default sbom format) —
# lets a downstream security team inspect exactly what's in a release
# artifact without unpacking it.
sboms:
  - artifacts: archive

# Cosign keyless signing (GitHub Actions OIDC identity, no private key to
# manage or leak) over checksums.txt — one signature covers every archive
# hash in the release, so verifying it verifies all of them. Uses --bundle
# (cosign v2.5+/v3's unified verification-material format) rather than the
# older --output-signature/--output-certificate flags, which current cosign
# no longer has.
# Verify with: cosign verify-blob --bundle checksums.txt.bundle
#   --certificate-identity-regexp "https://github.com/kabirnarang39/skillci/.*"
#   --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# brews was deprecated in goreleaser v2.10 (fully removed v2.16) in favor
# of homebrew_casks, which is now the only supported way to publish a
# precompiled-binary formula — see goreleaser.com/deprecations/#brews.
homebrew_casks:
  - name: skillci
    binaries:
      - skillci
    repository:
      owner: kabirnarang39
      name: homebrew-skillci
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/kabirnarang39/skillci"
    description: "Lint, eval, and regression-test Claude Skills against a model matrix"
    commit_author:
      name: skillci-bot
      email: kabirnarang39@gmail.com
    commit_msg_template: "brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    # skillci isn't signed/notarized (no Apple Developer Program
    # membership), so macOS Gatekeeper quarantines the downloaded binary
    # on first run without this — the standard workaround for unsigned
    # cask binaries.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/skillci"]
          end

scoops:
  - name: skillci
    ids: [skillci]
    repository:
      owner: kabirnarang39
      name: skillci
      branch: main
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: bucket
    homepage: "https://github.com/kabirnarang39/skillci"
    description: "Lint, eval, and regression-test Claude Skills against a model matrix"
    license: Apache-2.0
    commit_author:
      name: skillci-bot
      email: kabirnarang39@gmail.com
    commit_msg_template: "scoop bucket update for {{ .ProjectName }} version {{ .Tag }}"
